name: Keep warm

# Render spins a free web service down after 15 minutes without traffic, and Neon
# suspends its free compute after 5 minutes idle. That stops the timer-driven
# background services — bins stop filling, routes stop generating, invoices stop
# being raised — and makes the next visitor wait through a cold start.
#
# Pinging /health keeps both awake. GitHub Actions minutes are free on public
# repositories, so this costs nothing.
#
# Delete this workflow if you move to a paid plan that does not spin down.

on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled jobs on a best-effort basis and can
    # delay them under load, so treat this as "roughly every 10-15 minutes".
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        if: ${{ vars.API_BASE_URL != '' }}
        run: |
          # The app may be cold, and the serverless database can take ~30s to
          # resume, so allow a generous timeout and a few attempts before failing.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "${{ vars.API_BASE_URL }}/health" || echo "000")

            if [ "$code" = "200" ]; then
              echo "API is awake (attempt $attempt)."
              exit 0
            fi

            echo "Attempt $attempt returned $code; retrying in 20s."
            sleep 20
          done

          echo "API did not respond after 5 attempts."
          exit 1
